# Stacking: a non-negative linear meta-model learns weights on out-of-fold predictions
# of SVR and CatBoost (inner cv=5 inside each outer fold, so CV stays honest).
# Base models come from svr.yaml / catboost.yaml via defaults, so tuned params apply here too.
# Override a base model from CLI, e.g. model._svr.regressor.C=30.
defaults:
  - /model@_svr: svr
  - /model@_catboost: catboost

name: stack_svr_catboost
scale: true
regressor:
  _target_: src.models.ensembles.stacking
  _convert_: all
  cv: 5
  final_estimator:
    _target_: sklearn.linear_model.LinearRegression
    positive: true
  estimators:
    svr: ${model._svr.regressor}
    catboost: ${model._catboost.regressor}
