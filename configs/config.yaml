defaults:
  - model: catboost
  - cv: stratified
  - _self_

name_exp: v1
seed: 0xFACED
feature_set: pruned_ordinal
train_path: data/train.csv
test_path: data/test.csv
submit: true
predict_with: refit  # refit (all rows) | folds (mean of CV fold models) | first_fold

hydra:
  job:
    env_set:
      # torch and xgboost each bundle libomp; with both loaded, multithreaded
      # OpenMP segfaults on macOS. One OpenMP thread avoids the crash.
      OMP_NUM_THREADS: "1"
  run:
    dir: artefacts/hydra/${name_exp}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: artefacts/hydra/multirun/${name_exp}/${now:%Y-%m-%d_%H-%M-%S}
