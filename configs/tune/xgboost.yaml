# uv run python run.py model=xgboost +tune=xgboost
# params: paths relative to model.regressor
n_trials: 40
params:
  n_estimators: {type: int, low: 300, high: 2000, step: 100}
  learning_rate: {type: float, low: 0.01, high: 0.2, log: true}
  max_depth: {type: int, low: 3, high: 8}
  min_child_weight: {type: float, low: 1, high: 10, log: true}
  subsample: {type: float, low: 0.5, high: 1.0}
  colsample_bytree: {type: float, low: 0.2, high: 1.0}
  reg_lambda: {type: float, low: 0.001, high: 10, log: true}
  reg_alpha: {type: float, low: 0.0001, high: 1, log: true}
