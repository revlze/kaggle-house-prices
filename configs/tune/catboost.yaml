# uv run python run.py model=catboost +tune=catboost
# params: paths relative to model.regressor
n_trials: 20
params:
  iterations: {type: int, low: 300, high: 2000, step: 100}
  depth: {type: int, low: 4, high: 8}
  learning_rate: {type: float, low: 0.01, high: 0.2, log: true}
  l2_leaf_reg: {type: float, low: 1, high: 10, log: true}
  random_strength: {type: float, low: 0.0, high: 10.0}
  bagging_temperature: {type: float, low: 0.0, high: 1.0}
  rsm: {type: float, low: 0.1, high: 1.0}